<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zssh-record live viewer</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel2: #1b232c;
    --fg: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --warn: #e3b341;
    --error: #f85149;
    --info: #56d364;
    --debug: #6e7681;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px; line-height: 1.45;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid #30363d;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--accent); }
  header .meta { color: var(--muted); font-size: 12px; }
  header .meta b { color: var(--fg); font-weight: 600; }
  #main {
    display: grid;
    gap: 1px;
    background: #30363d;
  }
  .pane {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--panel);
  }
  .pane .title {
    padding: 6px 10px; background: var(--panel2); color: var(--muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    border-bottom: 1px solid #30363d;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pane.errors .title { color: var(--error); }
  .pane .title .status { font-size: 10px; color: var(--info); }
  .pane .title .status.off { color: var(--error); }
  pre.log {
    margin: 0; padding: 8px 12px; flex: 1; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
    background: var(--bg); color: var(--fg);
  }
  .l-error { color: var(--error); }
  .l-warn  { color: var(--warn); }
  .l-info  { color: var(--info); }
  .l-debug { color: var(--debug); }
  pre.log::-webkit-scrollbar { width: 10px; }
  pre.log::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  .pane.errors pre.log:empty::before {
    content: 'No errors yet.';
    color: var(--muted);
  }
  #clear-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: center; padding: 6px 0;
    background: var(--panel); border-top: 1px solid #30363d;
  }
  #clear-bar button {
    background: #da3633; color: #fff; border: none; border-radius: 6px;
    padding: 6px 28px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; letter-spacing: .03em;
  }
  #clear-bar button:hover { background: #f85149; }
  #main { height: calc(100vh - 41px - 37px); }
</style>
</head>
<body>
<header>
  <h1>zssh-record</h1>
  <div class="meta">
    <span>epic <b id="m-epic">-</b></span> |
    <span>task <b id="m-task">-</b></span> |
    <span>target <b id="m-target">-</b></span> |
    <span>started <b id="m-started">-</b></span>
  </div>
</header>
<div id="main"></div>
<div id="clear-bar"><button onclick="clearAll()">Clear</button></div>

<script>
  const RX_ERROR = /(ERROR|FATAL|CRIT|panic|Traceback)/;
  const RX_WARN  = /(WARN(ING)?)/i;
  const RX_INFO  = /(INFO)/;
  const RX_DEBUG = /(DEBUG|TRACE)/;
  const RX_ANSI  = /\x1B\[[0-9;]*[A-Za-z]/g;
  const MAX_LINES = 2000;
  const FLUSH_MS = 50;

  function clearAll() {
    document.querySelectorAll('pre.log').forEach(p => { p.innerHTML = ''; });
  }

  function classify(line) {
    if (RX_ERROR.test(line)) return 'l-error';
    if (RX_WARN.test(line))  return 'l-warn';
    if (RX_INFO.test(line))  return 'l-info';
    if (RX_DEBUG.test(line)) return 'l-debug';
    return '';
  }

  function attach(streamName, paneIds, errorsOnly) {
    const panes = paneIds.map(id => document.getElementById(id));
    const statuses = paneIds.map(id => document.getElementById('s-' + id));
    const pinned = panes.map(() => true);
    const queues = panes.map(() => []);
    let scheduled = false;

    panes.forEach((p, i) => {
      p.addEventListener('scroll', () => {
        pinned[i] = (p.scrollTop + p.clientHeight + 4) >= p.scrollHeight;
      });
    });

    function flush() {
      scheduled = false;
      panes.forEach((pane, i) => {
        if (!queues[i].length) return;
        const frag = document.createDocumentFragment();
        for (const line of queues[i]) {
          const cls = classify(line);
          const span = document.createElement('span');
          if (cls) span.className = cls;
          span.appendChild(document.createTextNode(line + '\n'));
          frag.appendChild(span);
        }
        queues[i] = [];
        pane.appendChild(frag);
        while (pane.childElementCount > MAX_LINES) pane.removeChild(pane.firstChild);
        if (pinned[i]) pane.scrollTop = pane.scrollHeight;
      });
    }

    const es = new EventSource('/stream/' + streamName);
    es.onmessage = (ev) => {
      const raw = ev.data.replace(RX_ANSI, '');
      panes.forEach((_, i) => {
        if (errorsOnly[i] && !RX_ERROR.test(raw)) return;
        queues[i].push(raw);
      });
      if (!scheduled) { scheduled = true; setTimeout(flush, FLUSH_MS); }
    };
    es.onerror = () => {
      statuses.forEach(s => { if(s){ s.textContent = 'closed'; s.classList.add('off'); }});
    };
  }

  function prettyName(stream) {
    // wb_agent_ncp3 -> "wb_agent  NCP 3"
    // wb_fe_agent_ncp6 -> "wb_fe_agent  NCP 6"
    return stream.replace(/_ncp(\d+)$/, '  NCP $1');
  }

  function buildPanes(streams) {
    const main = document.getElementById('main');

    // Group by NCP: {3: [wb_agent_ncp3, wb_fe_agent_ncp3], 6: [...]}
    const ncps = {};
    for (const s of streams) {
      const m = s.match(/_ncp(\d+)$/);
      const id = m ? m[1] : '0';
      if (!ncps[id]) ncps[id] = [];
      ncps[id].push(s);
    }
    const ncpKeys = Object.keys(ncps).sort((a, b) => +a - +b);
    const numNcps = ncpKeys.length;

    // Grid: columns = agents per NCP (usually 2: wb_agent + wb_fe_agent)
    // rows = NCPs * 2 (full + errors-only)
    const maxCols = Math.max(...ncpKeys.map(k => ncps[k].length));
    main.style.gridTemplateColumns = `repeat(${maxCols}, 1fr)`;
    main.style.gridTemplateRows = `repeat(${numNcps * 2}, 1fr)`;

    for (const ncpId of ncpKeys) {
      const agentStreams = ncps[ncpId].sort();
      for (const stream of agentStreams) {
        // Full pane
        const fullId = 'log-' + stream;
        const sec = document.createElement('section');
        sec.className = 'pane';
        sec.innerHTML = `<div class="title"><span>${prettyName(stream)}</span><span class="status" id="s-${fullId}">live</span></div><pre class="log" id="${fullId}"></pre>`;
        main.appendChild(sec);
      }
      // Pad if this NCP has fewer agents
      for (let i = agentStreams.length; i < maxCols; i++) {
        const pad = document.createElement('section');
        pad.className = 'pane';
        pad.innerHTML = '<div class="title"><span>&nbsp;</span></div><pre class="log"></pre>';
        main.appendChild(pad);
      }
      // Errors-only row for this NCP
      for (const stream of agentStreams) {
        const errId = 'log-' + stream + '-err';
        const sec = document.createElement('section');
        sec.className = 'pane errors';
        sec.innerHTML = `<div class="title"><span>${prettyName(stream)} — ERRORS</span><span class="status" id="s-${errId}">live</span></div><pre class="log" id="${errId}"></pre>`;
        main.appendChild(sec);
      }
      for (let i = agentStreams.length; i < maxCols; i++) {
        const pad = document.createElement('section');
        pad.className = 'pane errors';
        pad.innerHTML = '<div class="title"><span>&nbsp;</span></div><pre class="log"></pre>';
        main.appendChild(pad);
      }
    }

    // Attach SSE streams
    for (const ncpId of ncpKeys) {
      for (const stream of ncps[ncpId]) {
        const fullId = 'log-' + stream;
        const errId  = 'log-' + stream + '-err';
        attach(stream, [fullId, errId], [false, true]);
      }
    }
  }

  // Load metadata + discover streams
  fetch('/meta.json').then(r => r.json()).then(m => {
    if (m.epic)        document.getElementById('m-epic').textContent    = m.epic;
    if (m.task)        document.getElementById('m-task').textContent    = m.task;
    if (m.target)      document.getElementById('m-target').textContent  = m.target;
    if (m.started_at)  document.getElementById('m-started').textContent = m.started_at;
    document.title = `zssh: ${m.epic||'?'} / ${m.task||'?'} / ${m.target||'?'}`;
  }).catch(()=>{});

  fetch('/streams.json').then(r => r.json()).then(buildPanes).catch(() => {
    // Fallback: static 2-column layout for legacy single-NCP
    buildPanes(['wb_agent_ncp0', 'wb_fe_agent_ncp0']);
  });
</script>
</body>
</html>
