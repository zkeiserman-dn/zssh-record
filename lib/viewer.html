<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zssh-record live viewer</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel2: #1b232c;
    --fg: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --warn: #e3b341;
    --error: #f85149;
    --info: #56d364;
    --debug: #6e7681;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px; line-height: 1.45;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid #30363d;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--accent); }
  header .meta { color: var(--muted); font-size: 12px; }
  header .meta b { color: var(--fg); font-weight: 600; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: #30363d;
    height: calc(100vh - 41px);
  }
  .pane {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--panel);
  }
  .pane .title {
    padding: 6px 10px; background: var(--panel2); color: var(--muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    border-bottom: 1px solid #30363d;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pane.errors .title { color: var(--error); }
  .pane .title .status { font-size: 10px; color: var(--info); }
  .pane .title .status.off { color: var(--error); }
  pre.log {
    margin: 0; padding: 8px 12px; flex: 1; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
    background: var(--bg); color: var(--fg);
  }
  .l-error { color: var(--error); }
  .l-warn  { color: var(--warn); }
  .l-info  { color: var(--info); }
  .l-debug { color: var(--debug); }
  pre.log::-webkit-scrollbar { width: 10px; }
  pre.log::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  .pane.errors pre.log:empty::before {
    content: 'No errors yet.';
    color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>zssh-record</h1>
  <div class="meta">
    <span>epic <b id="m-epic">-</b></span> |
    <span>task <b id="m-task">-</b></span> |
    <span>target <b id="m-target">-</b></span> |
    <span>started <b id="m-started">-</b></span>
  </div>
</header>

<main>
  <section class="pane">
    <div class="title">
      <span>wb_agent  (wb_agent.log)</span>
      <span class="status" id="s-wb">live</span>
    </div>
    <pre class="log" id="log-wb"></pre>
  </section>
  <section class="pane">
    <div class="title">
      <span>wb_fe_agent  (wb_fe_agent.log)</span>
      <span class="status" id="s-fe">live</span>
    </div>
    <pre class="log" id="log-fe"></pre>
  </section>
  <section class="pane errors">
    <div class="title">
      <span>wb_agent &mdash; ERRORS only</span>
      <span class="status" id="s-wb-err">live</span>
    </div>
    <pre class="log" id="log-wb-err"></pre>
  </section>
  <section class="pane errors">
    <div class="title">
      <span>wb_fe_agent &mdash; ERRORS only</span>
      <span class="status" id="s-fe-err">live</span>
    </div>
    <pre class="log" id="log-fe-err"></pre>
  </section>
</main>

<script>
  const RX_ERROR = /(ERROR|FATAL|CRIT|panic|Traceback)/;
  const RX_WARN  = /(WARN(ING)?)/i;
  const RX_INFO  = /(INFO)/;
  const RX_DEBUG = /(DEBUG|TRACE)/;
  const RX_ANSI  = /\x1B\[[0-9;]*[A-Za-z]/g;

  function classify(line) {
    if (RX_ERROR.test(line)) return 'l-error';
    if (RX_WARN.test(line))  return 'l-warn';
    if (RX_INFO.test(line))  return 'l-info';
    if (RX_DEBUG.test(line)) return 'l-debug';
    return '';
  }

  const MAX_LINES = 2000;
  const FLUSH_MS = 50;

  function attach(streamName, paneIds, statusIds, errorsOnly) {
    paneIds = Array.isArray(paneIds) ? paneIds : [paneIds];
    statusIds = Array.isArray(statusIds) ? statusIds : [statusIds];
    errorsOnly = errorsOnly || [];
    const panes = paneIds.map(id => document.getElementById(id));
    const statuses = statusIds.map(id => document.getElementById(id));
    const pinned = panes.map(() => true);

    panes.forEach((pane, i) => {
      pane.addEventListener('scroll', () => {
        pinned[i] = (pane.scrollTop + pane.clientHeight + 4) >= pane.scrollHeight;
      });
    });

    const queues = panes.map(() => []);
    let scheduled = false;

    function flush() {
      scheduled = false;
      panes.forEach((pane, i) => {
        if (!queues[i].length) return;
        const frag = document.createDocumentFragment();
        for (const line of queues[i]) {
          const cls = classify(line);
          const span = document.createElement('span');
          if (cls) span.className = cls;
          span.appendChild(document.createTextNode(line + '\n'));
          frag.appendChild(span);
        }
        queues[i] = [];
        pane.appendChild(frag);
        while (pane.childElementCount > MAX_LINES) pane.removeChild(pane.firstChild);
        if (pinned[i]) pane.scrollTop = pane.scrollHeight;
      });
    }

    const es = new EventSource('/stream/' + streamName);
    es.onmessage = (ev) => {
      const raw = ev.data.replace(RX_ANSI, '');
      panes.forEach((_pane, i) => {
        if (errorsOnly[i] && !RX_ERROR.test(raw)) return;
        queues[i].push(raw);
      });
      if (!scheduled) { scheduled = true; setTimeout(flush, FLUSH_MS); }
    };
    es.onerror = () => {
      statuses.forEach(s => { s.textContent = 'closed'; s.classList.add('off'); });
    };
  }

  fetch('/meta.json').then(r => r.json()).then(m => {
    if (m.epic)        document.getElementById('m-epic').textContent    = m.epic;
    if (m.task)        document.getElementById('m-task').textContent    = m.task;
    if (m.target)      document.getElementById('m-target').textContent  = m.target;
    if (m.started_at)  document.getElementById('m-started').textContent = m.started_at;
    document.title = `zssh: ${m.epic||'?'} / ${m.task||'?'} / ${m.target||'?'}`;
  }).catch(()=>{});

  attach('wb', ['log-wb', 'log-wb-err'], ['s-wb', 's-wb-err'], [false, true]);
  attach('fe', ['log-fe', 'log-fe-err'], ['s-fe', 's-fe-err'], [false, true]);
</script>
</body>
</html>
